# AMZ — Bug Bounty Recon Automation Platform
# All services are pinned to an explicit named bridge network (amz_net).
# We do NOT rely on Compose's implicit default network.

services:
  database:
    image: postgres:16-alpine
    container_name: amz_database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - amz_pgdata:/var/lib/postgresql/data
    networks:
      - amz_net
    healthcheck:
      # pg_isready is the canonical readiness probe for Postgres.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: amz_redis
    restart: unless-stopped
    networks:
      - amz_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: amz_backend
    restart: unless-stopped
    env_file:
      - .env
    # entrypoint.sh waits for DB, runs `alembic upgrade head`, then boots uvicorn.
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - amz_net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
    container_name: amz_worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - amz_net

  frontend:
    build:
      context: ./frontend
    container_name: amz_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - amz_net
    ports:
      - "3000:80"

volumes:
  amz_pgdata:

# Explicit, named custom bridge network. Every service above joins it,
# so service-name DNS (database, redis, backend, frontend) resolves reliably.
networks:
  amz_net:
    name: amz_net
    driver: bridge
